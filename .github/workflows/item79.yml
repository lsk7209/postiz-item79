name: Item79 checks and Contabo delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: item79-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install isolated test compiler
        run: npm install --prefix "$RUNNER_TEMP/item79-tests" --ignore-scripts --no-audit --no-fund typescript@5.5.4
      - run: node --test tests/*.test.mjs
        env:
          NODE_PATH: ${{ runner.temp }}/item79-tests/node_modules
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Enforce retained worker and base-image policy
        run: |
          git fetch --no-tags --depth=1 origin 2c951cf3b67520ad449bb7d5a9d850518dbf3a89
          python3 ops/item79_release_policy.py --head "$GITHUB_SHA"
  image:
    needs: checks
    # Explicit repository switch controls image publication.
    if: github.event_name != 'pull_request' && vars.ITEM79_IMAGE_BUILD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reserve disk for pinned application image
        env:
          ITEM79_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$ITEM79_RUNNER_ENVIRONMENT" = github-hosted
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          test -n "$docker_root" && test -d "$docker_root"
          df -h "$docker_root"
          free -h
          # These are disposable runner SDKs, never production resources.
          # The image build uses only Docker, git, Python and jq.
          for sdk in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if [ -d "$sdk" ] && [ ! -L "$sdk" ]; then
              sudo rm -rf --one-file-system -- "$sdk"
            fi
          done
          df -h "$docker_root"
          available=$(df -B1 --output=avail "$docker_root" | tail -1)
          test "$available" -ge 25769803776
      - name: Build and publish exact-revision image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'df -h /; free -h' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image="ghcr.io/lsk7209/postiz-item79:$REVISION"
          metadata_file=$(mktemp "$RUNNER_TEMP/item79-image.XXXXXX.json")
          # Stream to the registry instead of importing the rebuilt application
          # layer into the runner's local Docker image store before pushing it.
          docker buildx build -f Dockerfile.item79 --provenance=false \
            --cache-from type=registry,ref=ghcr.io/lsk7209/postiz-item79:buildcache \
            --cache-to type=inline --build-arg "ITEM79_REVISION=$REVISION" \
            --metadata-file "$metadata_file" \
            -t "$image" -t ghcr.io/lsk7209/postiz-item79:buildcache --push .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$metadata_file")
          echo "image=ghcr.io/lsk7209/postiz-item79@$digest" >> "$GITHUB_OUTPUT"
      - name: Build resource diagnostics
        if: always()
        continue-on-error: true
        run: |
          df -h /
          free -h
          docker system df
  deploy:
    needs: image
    # Enabled only after isolated preview, backup and restricted SSH setup.
    if: github.ref == 'refs/heads/main' && vars.CONTABO_DEPLOY_ENABLED == 'true'
    environment: contabo
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy through restricted SSH entry point
        env:
          DEPLOY_KEY: ${{ secrets.CONTABO_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.CONTABO_HOST }}
          DEPLOY_USER: ${{ secrets.CONTABO_USER }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
          IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/item79
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$IMAGE" =~ ^ghcr.io/lsk7209/postiz-item79@sha256:[a-f0-9]{64}$ ]]
          git fetch --no-tags --depth=1 origin 2c951cf3b67520ad449bb7d5a9d850518dbf3a89
          python3 ops/item79_release_policy.py --head "$REVISION" > "$RUNNER_TEMP/item79-policy.json"
          python3 -c 'import json,os; p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"item79-policy.json"))); p.update({"revision":os.environ["REVISION"],"registryUser":os.environ["REGISTRY_USER"],"registryToken":os.environ["REGISTRY_TOKEN"]}); print(json.dumps(p))' | \
          ssh -i ~/.ssh/item79 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $IMAGE"
